<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💝</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💝</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="question-screen" class="screen active">
            <h1 class="question">Will You Be My Valentine? 💝</h1>
            
            <div class="buttons-container">
                <button id="yes-btn" class="btn yes-btn">Yes</button>
                <button id="no-btn" class="btn no-btn">No</button>
            </div>
        </div>
        
        <div id="success-screen" class="screen">
            <h1 class="celebration">Yay! 🎉💕</h1>
            <p class="success-message">I'm so happy! You've made my day! I love you so much! 💖</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
